[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syllabus-studio"
version = "0.1.0"
description = "Turn a syllabus into an interactive, self-paced course."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
syllabus-studio = "syllabus_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/syllabus_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["syllabus_studio"]
ignore_missing_imports = true
